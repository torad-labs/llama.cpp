# Every parameter that changes how fast or how exactly the engine runs, and whether a search can set it yet.
#
# One line a parameter. `available = true` is the tick: the parameter can be set from outside the code and the engine
# checks what it is given. Tick a line when its work lands; scripts/tunables.py check holds the list to the source.
#
#   set        env: an environment variable   cli: a llama-server flag   build: a CMake option
#              code: a constant in the source, not settable yet (where says which)
#   available  env: read through the knob registry (ggml_env_* in ggml.h), so its type, default and range below are
#              what the engine enforces; false: still read with getenv, the engine checks nothing
#              cli, build: true, the flag or option exists   code: false until it becomes one of the others
#   type, default, min/max or values   what unset means and what is accepted ("auto": the engine picks, per device or model)
#   kind       knob: worth searching   legacy: brings back the path a change replaced   diag: logs, traces, checks
#              setup: paths, devices and process identity
#   scope      shared: every model   inkling2: Inkling 2 only   other: another model or backend (listed, not worked on here)
#   layer      cuda, cpu, ggml, model, llama, server, common, build
#   output     same: the result is bit-identical   rounding: differs within floating-point rounding
#              model: changes what is computed. Not given where nobody has established it
#   launcher   the flag of scripts/inkling2/serve.py that sets it
#   indirect   read through a table or a macro, so the source scan does not see its name
#
# Not listed: model files, sampling, chat template, network and logging flags, and the variables of backends this fork
# does not serve with (ignore_prefixes). A run started with GGML_TUNABLES_STRICT=1 stops on a value outside what is
# declared here or on an undeclared GGML_/LLAMA_ variable, and GGML_TUNABLES_DUMP=<file> records what it read.
#
#   scripts/tunables.py list --available --scope shared,inkling2 --kind knob    the search space today
#   scripts/tunables.py status                                                  the count by scope, kind and set
#   scripts/tunables.py gen                                                     after editing: ggml/src/ggml-tunables.inc

ignore_prefixes = ["LLAMA_ARG_", "LLAMA_TEST_", "GGML_TEST_", "LLAMA_EVAL_", "LLAMA_DEBUG_JINJA", "LLAMA_API_KEY", "GGML_OPENCL_", "GGML_VK_", "GGML_VULKAN_", "GGML_SYCL_", "GGML_HEXAGON_", "GGML_OPENVINO_", "GGML_CANN_", "GGML_METAL_", "GGML_RPC_", "GGML_RDMA_", "GGML_ET_", "GGML_ZDNN_", "GGML_ZENDNN_", "GGML_REMOTING_"]

