# Compile-time kernel constants, swept as build defines by kernel_sweep.py.
#
# A sweep reconfigures and rebuilds test-backend-ops once per value with the constant passed on the compiler
# command line (-DCMAKE_CUDA_FLAGS=-DNAME=value) and times one op at the serving shapes. That only works when the
# source wraps its own #define in #ifndef NAME: without the guard the source's #define wins over the command line
# (macro redefinition, the later one takes effect) and the sweep silently measures the default again. plan and run
# check each source file and refuse a constant whose guard is missing, naming the file and line to fix.
#
# Every constant below is unguarded in the tree as of 2026-11-22, so every entry declares needs_guard = true and
# run refuses until the guard is added. The guard is an engine change, made in its own commit, not by this harness.
# The define rides CMAKE_CUDA_FLAGS because every swept constant lives in a .cu/.cuh; a constant also read by C++
# files needs the same -D in CMAKE_CXX_FLAGS, added to the configure line here.
# The timing command is filled in on the box: -b is the card, -o the op filter, -p the serving shape regex. The
# harness passes every argument through untouched and never adds or rewrites a flag.

[build]
# Paths are resolved against this file's directory.
source_dir = "../.."
build_dir = "../../build-kernel-sweep"
target = "test-backend-ops"
jobs = 8
configure = ["cmake", "-S", "{source_dir}", "-B", "{build_dir}", "-DGGML_CUDA=ON", "-DCMAKE_BUILD_TYPE=Release", "-DLLAMA_BUILD_TESTS=ON", "-DCMAKE_CUDA_FLAGS=-D{macro}={value}"]
build = ["cmake", "--build", "{build_dir}", "--target", "{target}", "-j", "{jobs}"]
binary = "{build_dir}/bin/test-backend-ops"

[timing]
# The default timing run. On the box, add -p to select the Inkling 2 Small serving cases (for example
# -p "n_mats=384,n_used=8,") and keep -b on the card under test. Do not add a timeout anywhere: a build or a
# timing run goes on until it finishes.
command = ["{binary}", "perf", "-b", "CUDA0", "-o", "MUL_MAT_ID"]

[constants.MMQ_NWARPS]
define = "MMQ_NWARPS"
source = "ggml/src/ggml-cuda/mmq.cuh"
source_line = 16
kind = "macro"
default = 8
values = [4, 8, 16]
op = "MUL_MAT Q3_K"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/mmq.cuh:16 in #ifndef MMQ_NWARPS / #endif"
note = "no reader in the tree today: MMQ block warps come from ggml_cuda_mmq_get_nthreads() and the Blackwell CASE table, so a sweep here measures noise until a kernel reads the macro again"

[constants.MMQ_NWARPS.rules]
power_of_two = true

[constants.MMQ_ITER_K]
define = "MMQ_ITER_K"
source = "ggml/src/ggml-cuda/mmq.cuh"
source_line = 14
kind = "macro"
default = 256
values = [128, 256, 512]
op = "MUL_MAT_ID Q3_K"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/mmq.cuh:14 in #ifndef MMQ_ITER_K / #endif"
note = "a tile of MMQ_ITER_K columns is divided by the quant block size (blocks_per_iter = ITER_K / qk), so 128 is pruned: it is zero blocks for the 256-element K-quant blocks"

[constants.MMQ_ITER_K.rules]
multiple_of = 256

[constants.MMVQ_MAX_BATCH_SIZE]
define = "MMVQ_MAX_BATCH_SIZE"
source = "ggml/src/ggml-cuda/mmvq.cuh"
source_line = 3
kind = "macro"
default = 8
values = [4, 8, 16, 32]
op = "MUL_MAT_ID Q4_K"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/mmvq.cuh:3 in #ifndef MMVQ_MAX_BATCH_SIZE / #endif"
note = "most tokens the row kernel takes before MMQ; a value above MMVQ_MMID_CEILING cannot be reached by MUL_MAT_ID"

[constants.MMVQ_MAX_BATCH_SIZE.rules]
min = 1
max = 64

[constants.MMVQ_MMID_BLOCK_WARPS]
define = "MMVQ_MMID_BLOCK_WARPS"
source = "ggml/src/ggml-cuda/mmvq.cuh"
source_line = 6
kind = "macro"
default = 16
values = [8, 16, 32]
op = "MUL_MAT_ID Q4_K"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/mmvq.cuh:6 in #ifndef MMVQ_MMID_BLOCK_WARPS / #endif"

[constants.MMVQ_MMID_BLOCK_WARPS.rules]
power_of_two = true

[constants.MMVQ_MMID_CEILING]
define = "MMVQ_MMID_CEILING"
source = "ggml/src/ggml-cuda/mmvq.cuh"
source_line = 7
kind = "macro"
default = 32
values = [16, 32, 64]
op = "MUL_MAT_ID Q4_K"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/mmvq.cuh:7 in #ifndef MMVQ_MMID_CEILING / #endif, and give it a value of its own if it is swept alone: today it is (2 * MMVQ_MMID_BLOCK_WARPS), so a command-line value is otherwise inconsistent with the block it derives from"

[constants.MMVQ_MOE_MAX_PAIRS]
define = "MMVQ_MOE_MAX_PAIRS"
source = "ggml/src/ggml-cuda/mmvq-moe.cu"
source_line = 65
kind = "macro"
default = 64
values = [64]
op = "MOE Q4_K"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/mmvq-moe.cu:65 in #ifndef MMVQ_MOE_MAX_PAIRS / #endif"
note = "static_assert at mmvq-moe.cu:72 requires exactly 64 (an expert's pairs are a 64-bit mask), so 64 is the only value that builds today"

[constants.FATTN_KQ_STRIDE]
define = "FATTN_KQ_STRIDE"
source = "ggml/src/ggml-cuda/fattn-common.cuh"
source_line = 9
kind = "macro"
default = 256
values = [128, 256, 512]
op = "FLASH_ATTN_EXT"
needs_guard = true
guard_hint = "wrap ggml/src/ggml-cuda/fattn-common.cuh:9 in #ifndef FATTN_KQ_STRIDE / #endif"
timing = ["{binary}", "perf", "-b", "CUDA0", "-o", "FLASH_ATTN_EXT"]

[constants.FATTN_KQ_STRIDE.rules]
multiple_of = 128

[constants.graph_slot_max_tokens]
define = "GRAPH_SLOT_MAX_TOKENS"
source = "src/llama-context.h"
source_line = 615
kind = "constexpr"
default = 32
values = [8, 16, 32, 64]
op = "llama context graph slots"
needs_guard = true
guard_hint = "replace static constexpr uint32_t graph_slot_max_tokens = 32 at src/llama-context.h:615 with #ifndef GRAPH_SLOT_MAX_TOKENS / #define GRAPH_SLOT_MAX_TOKENS 32 / #endif and use the macro"
timing = []
note = "test-backend-ops does not hold this constant; fill a serving command (Inkling 2 runner or llama-server) in timing on the box before sweeping"

[constants.graph_slot_max_tokens.rules]
power_of_two = true
