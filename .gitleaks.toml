# Repo-local gitleaks config, auto-loaded from the scan root by the org's required
# secret-scan workflow.
#
# Written 2026-09-20 from the full-history scan of torad-labs/llama.cpp (10,688 commits,
# gitleaks v8.21.2 as the org workflow pins it): 12 findings, every one opened at its commit,
# none live — all in upstream ggml-org commits, none in the torad patch-set. It NARROWS six
# false-positive classes only (three found then; two added on 2026-11-02: the glm53 asset hashes
# torad's own README records, and the PNG fixture in upstream's server tests; one on 2026-11-14 with
# the merge of upstream v1.0.0: a parser tag name in common/chat-peg-parser.h); it never disables
# a rule and never turns off the default ruleset.
#
# `regexTarget = "match"` with FULL identifiers, never "line": the line form suppresses the whole
# line a finding sits on, which would hide a real credential sharing it. Proven with canaries on
# 2026-09-20 (see TORAD.md): control = 12 + canaries with no config; red = a canary on the same
# line as an allowlisted value still fires with this config; green = 0 on main.
#
# Each entry sits on the allowlist of the rule whose findings it silences, never on the global
# [allowlist]. gitleaks v8.21.2 appends its own default global regexes to that one and tests
# them against its regexTarget: under "match", the default `(?i)^true|false|null$` silenced any
# finding whose match, variable name included, held `false` (github-operator#129,
# 2026-11-03). Nothing is appended to a rule's own allowlist, so the
# defaults keep the secret as their target. Entries unchanged; the full-history scan on
# 2026-11-03 found no finding that only the widened default silenced.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = """
1. GitHub Actions cache keys in upstream's build workflows (`key: ggml-ci-arm64-cpu-kleidiai`,
   `key: arm64-cpu-kleidiai-graviton4`, commented or not): a cache name, not a credential.
2. xxhash's AVX-512 lane variables `data_key_lo` / `data_key_hi` in the vendored
   examples/gguf-hash/deps/xxhash/xxhash.h.
3. The recorded tokenizer git revision (40 hex) and the tokenizer JSON SHA256 (64 hex) in
   scripts/glm53/assets/README.md: content hashes that pin an asset, not credentials.
4. The 1x1 PNG under JSON_MULTIMODAL_KEY in upstream's tools/server/tests/unit/test_completion.py,
   a base64 image fixture the generic-api-key rule reads as a key (iVBORw0KGgo is the PNG header).
5. The tag name of a dictionary key in upstream's Gemma 4 argument parser, `DICT_KEY = "gemma4-dict-key"`
   in common/chat-peg-parser.h (upstream v1.0.0, commit 93cf736a8): a PEG rule's tag, not a credential.
   The value is pinned, so another value under that name still fires.
"""
regexTarget = "match"
regexes = [
  '''key: (ggml-ci-|arm64-cpu-)[a-z0-9-]+''',
  '''data_key_(lo|hi) = _mm512_srli_epi64''',
  '''tokenizer revision: `[0-9a-f]{40}`''',
  '''Tokenizer JSON SHA256:\s*`[0-9a-f]{64}`''',
  '''JSON_MULTIMODAL_KEY: "iVBORw0KGgo[A-Za-z0-9+/=]+"''',
  '''DICT_KEY\s+= "gemma4-dict-key"''',
]

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "The placeholder `x-api-key: your-api-key` in tools/server/README.md's Anthropic-API example."
regexTarget = "match"
regexes = [
  '''x-api-key: your-api-key''',
]
