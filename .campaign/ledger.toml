  "2026-11-22 03:22 CT llamacpp-coordinator: 2026-11-22 03:52 CT llamacpp-coordinator: QGRE's lossless FP8 accumulator shape is this row's reference design. Read engine/qgre-core/qgre-silicon/kernels/l1-hardware/reduce/silicon_l1_pair_kslice_sum.cuh and silicon_l1_pair_partial_row_combine_two_term.cuh. Shape: values and partials are e4m3 scalar pairs (hi + lo), each with its own E8M0 block scale; every term rides the sm_120a block-scaled MMA (m16n8k32 kind::mxf8f6f4, scale_vec::1X) under its own scale; the fp32 accumulator lives only in the tensor-core fragment; the fold rounds once at the exit, so a carried partial's lo holds what hi cannot, and no software accumulation sits on the hot path. Blackwell law they encode: the scale operand's final producer is an LDS from shared memory, never ALU-assembled at the MMA (sm_120a QMMA scale-collector erratum). Falsifier stays: hi+lo quality against f16 on attention scores and the arch fixture's greedy chains.",
  '2026-11-22 03:24 CT llamacpp-coordinator: 2026-11-22 04:02 CT llamacpp-coordinator: Marcos: adopt the QGRE accumulator. Decision of record: this engine implements the e4m3 hi+lo pair accumulation with E8M0 per-block scales on the sm_120a block-scaled MMA. First target: global attention QK and PV; e4m3 K/V tying into the one-byte KV kernels, every term under its own scale, fp32 only in the accumulator fragment, partials across KV tiles and the shared-prefix merge carried as hi+lo pairs, one RNE encode per fold exit. Scale operands produced by LDS from shared memory, never assembled at the MMA (sm_120a QMMA scale-collector erratum). Lanes: inkling-quant owns the KV/kernel side, inkling-small the attention integration, qgre-lead consult. Sequence after the rel-mma q4 dispatch; not part of the current window.',
