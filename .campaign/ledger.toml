# The campaign ledger. Read and changed through `campaign` (run `campaign help`).
# Hand edits are fine; keep everything in fields, comments are not kept.

[campaign]
goal = ''
base = 'main'
judged = [
  '.campaign/checks/',
  '.campaign/cases/',
]
agent = 'campaign seat'

[feature."inkling-baseline"]
goal = 'Inkling 2 Small runs in our fork on current upstream llama.cpp, with GLM 5.3 serving unchanged.'

[[row]]
id = 'inkling-baseline-merge'
title = 'Upstream master is merged and the tree builds'
feature = 'inkling-baseline'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = 'Upstream ggml-org/llama.cpp at d3c3e242c16b8cbf51400fad410cd69b22d64f35 is merged into this fork. Conflicts are resolved so the fork GLM 5.3 serving behavior is preserved, and workflow files this fork deleted stay deleted. The merged tree configures and builds the server and its test programs with CUDA enabled.'
checks = [
  'git merge-base --is-ancestor d3c3e242c16b8cbf51400fad410cd69b22d64f35 HEAD',
  'git merge-base --is-ancestor d3c3e242c16b8cbf51400fad410cd69b22d64f35 HEAD && cmake -S . -B build-campaign -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=120a -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=OFF && cmake --build build-campaign -j --target llama-server test-llama-archs test-chat test-mtmd-impl test-backend-meta-split test-server-response test-backend-ops',
  'sh .campaign/cases/check.sh inkling-baseline-merge',
]
reviews = [
  'feature',
  'code',
]
notes = [
  '2026-11-16 23:53 CT: added; 2 of 2 checks fail, as they should before the work',
  '2026-11-16 23:53 CT llamacpp-issues: Dry run on 2026-11-16, merging d3c3e242c into 3d9eea147 in a temp worktree (removed after): 33 conflicted paths. Ten are .github/workflows files this fork deleted and upstream edited; keep them deleted. The 23 content conflicts sit mainly in the CUDA flash-attention files, the graph builder, the KV cache, the model loader and the server. Background: docs/torad/research/inkling-2-small/03-upstream-llama-port.md and 04-fork-gap-analysis.md.',
]

