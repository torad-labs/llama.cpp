spec = "2026-11-22 Marcos: accumulating in FP8 is one of the biggest levers. Inventory every accumulator on the hot decode path (rel-mma attention QK and PV, the expert and dense GEMMs, the split reductions) and what an e4m3 operand path buys on sm_120: twice the MMA rate and half the operand bytes, with f32 accumulation where the hardware gives it. FP8 accumulation proper must be hierarchical: e4m3 partials requantized at f32 chunk boundaries, because a naive e4m3 accumulator over a 262K-cell reduction fails by construction (three mantissa bits, error growing with the reduction; that is the named falsifier, not something to discover). First target: global attention QK and PV beside the one-byte KV work, where doc 18 names FP8 MMA as the unlock for one-byte KV. Quality gate: per-cell score error versus f16 and the arch fixture's greedy chains; GLM 5.3 untouched. Evidence: reports/inkling2-fp8-accumulation.json."
