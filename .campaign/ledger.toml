[[row]]
id = 'inkling-optimize-kv-precision'
title = 'Quantized KV proven for Inkling'
feature = 'inkling-optimize'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = "Inkling's keys and values, global and sliding layers, run from a q8_0 cache with logits agreeing with the F16 cache within the fixture's tolerance, and the two layers' precisions can be chosen separately where the plumbing allows. q4_0 stands behind the same proof. Nothing below F16 becomes the launcher's default until the real packs give a quality verdict, so what this item proves is that the capability is correct and in place, ready to switch on."
checks = [
  'git merge-base --is-ancestor d3c3e242c16b8cbf51400fad410cd69b22d64f35 HEAD && cmake -S . -B build-campaign -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=120a -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=OFF -DGGML_CCACHE=OFF && ctest --test-dir build-campaign -N -R inkling-kv | grep -qE "Total Tests: [1-9]" && cmake --build build-campaign -j && flock /run/user/1000/gpu1.lock env CUDA_VISIBLE_DEVICES=1 ctest --test-dir build-campaign -R inkling-kv --no-tests=error --output-on-failure && flock /run/user/1000/gpu1.lock env CUDA_VISIBLE_DEVICES=1 ./build-campaign/bin/test-llama-archs -a inkling2',
  'sh .campaign/cases/check.sh inkling-optimize-kv-precision',
]
reviews = [
  'feature',
  'code',
]
notes = [
  '2026-11-17 09:40 CT: added; 1 of 1 checks fail, as they should before the work',
  '2026-11-17 09:40 CT: Step 6 of docs/torad/research/inkling-2-small/06-optimization-roadmap.md. The fork flash-attention already reads q8_0 KV; prove global and sliding layers separately at depth on the synthetic fixture against F16, q4_0 behind the same proof. Real-weight quality verdict waits for packs on the rented box; the inkling2 launcher keeps F16 defaults until then (scripts/inkling2/serve.py). GPU: card 1 only under gpu1.lock, CUDA_VISIBLE_DEVICES=1.',
  "2026-11-17 15:07 CT: Machine load: keep every build you start at 8 jobs or fewer (cmake --build ... -j 8, never a bare -j). The frozen checks predate this and some run unbounded; that is the lead's to fix after this campaign lands, not yours to edit. Your own builds are yours: bound them.",
  "2026-11-21 20:00 CT claude-tensor4: 2026-11-22 claude-tensor4: Marcos's dequant-at-boundary question, assessed: pack-level NVFP4 is VRAM-infeasible at the production pool (+16 GiB a card, no headroom) - the capacity-tier play only. In-kernel FP8 fragment conversion trades against the int8 path at equal MMA issue rates and must be measured in the ring prototype. The bytes-dominant place a native format pays is the KV side of global attention: FP8 KV halves the 49.4 GB shared-prefix re-read (~9 ms/step at the stock trace); this fork already reads q4_0 KV natively (TORAD 60feea0), so an e4m3 KV variant belongs in this row's proof alongside q8_0/q4_0.",
  "2026-11-22 03:22 CT llamacpp-coordinator: 2026-11-22 03:44 CT llamacpp-coordinator: Marcos asks whether K and V are denoised before store, and whether it would be worth it. Today: no denoise. The store path has the model's own short convolution (learned temporal mixing), the K L2 clip and V RMS norm (bounding only), and the Hadamard rotation on quantized stores (decorrelation, exactly invertible). A truncating denoise is a different, lossy thing. Whether it pays is one measurable: per-head effective dimensionality (participation ratio) of K and V from a saved slot state, which kv_stats.py already reads offline and can compute on real rows decoded into the rotated domain. If energy concentrates well below 128 dims, truncation beats q4 on bytes and lowers q4's error; if it is spread, it fails on quality, which is the named falsifier. The measurement decides; no engine arm.",
]

