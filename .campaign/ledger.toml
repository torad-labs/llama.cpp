  '2026-11-22 02:00 CT llamacpp-coordinator: added by hand edit (campaign add would build the tree on torad-server). Direction from Marcos: the seam conversion is math, it removes work, so it needs no A/B; correctness checks gate it and the four-card integration run supplies the numbers once. Existing mechanisms it builds on: staged tile decode of q8_0/V (fattn-rel-elem, kv-onebyte row), the few-row shared q8_1 activation quantize (one form reused per input), and the fusion rows that cut the number of seams.',
  '2026-11-22 01:53 CT: 2026-11-22 02:05 CT llamacpp-coordinator: evidence basis recorded from Marcos: this is not a hypothesis. The same approach is already proven in production - GLM and Bonsai improved inference time hugely with it, and quantizing activations for Bonsai gave an insane throughput boost without losing quality. A/B is therefore reserved for cases of genuine uncertainty or loose relation; for this row the gate is correctness, and speed is confirmed once at integration.',
  '2026-11-22 01:54 CT: 2026-11-22 02:21 CT llamacpp-coordinator: production precedent in-fork for the seam approach (TORAD 5f1e3eebe): an F32 input read by several quantized products is quantized to q8_1 once by its first reader into a pool allocation and shared (GLM-5.3 KDA q/k/v, DSA q_a/kv_a, shared-expert gate/up); copy keyed by first byte, row length/count/stride, invalidated on in-place writes. This is the engine-level form of requantize-once-and-reuse the row asks for; the MUL_MAT_SHARED_SRC1 tests (96/96) are its mutation cases.',
]

