# The campaign ledger. Read and changed through `campaign` (run `campaign help`).
# Hand edits are fine; keep everything in fields, comments are not kept.

[campaign]
goal = ''
base = 'main'
judged = [
  '.campaign/checks/',
  '.campaign/cases/',
]
agent = 'campaign seat'
merge = 'pr'

[feature."inkling-baseline"]
goal = 'Inkling 2 Small runs in our fork on current upstream llama.cpp, with GLM 5.3 serving unchanged, landed on dev.'

[feature."inkling-split-state"]
goal = 'Inkling 2 runs split across devices with the same results as on one device, sequence state included.'

[feature."inkling-server-parity"]
goal = 'A synthetic Inkling model is served through this fork server with the same launcher, chat and prompt-cache behavior the GLM serving has, ready for the real packs.'

[feature."inkling-optimize"]
goal = 'Inkling 2 serving carries the optimization level of GLM Tensor 4 and is proven on this machine, so a rented four-card box only confirms numbers.'

