[[row]]
id = 'inkling-optimize-conv-kernel'
title = 'Short convolution as one stateful kernel'
feature = 'inkling-optimize'
status = 'todo'
owner = ''
blocked_by = []
guard = false
spec = "Each of an Inkling layer's four short convolutions runs as one stateful kernel instead of a chain of small operations: it reads the ring of the previous three positions plus the current rows, applies the static taps and, where the layer has them, the dynamic per-token taps and the scaled residual term, and writes the advanced ring for the next step. The state it leaves behind is the same state the current graph plumbing leaves, so rollback, chunked prompt processing, sequence copy and prompt-cache restore all behave exactly as before, and logits agree across chunk and sequence boundaries."
checks = [
  'git merge-base --is-ancestor d3c3e242c16b8cbf51400fad410cd69b22d64f35 HEAD && cmake -S . -B build-campaign -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=120a -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=OFF -DGGML_CCACHE=OFF && ctest --test-dir build-campaign -N -R inkling-conv | grep -qE "Total Tests: [1-9]" && cmake --build build-campaign -j && flock /run/user/1000/gpu1.lock env CUDA_VISIBLE_DEVICES=1 ctest --test-dir build-campaign -R inkling-conv --no-tests=error --output-on-failure && flock /run/user/1000/gpu1.lock env CUDA_VISIBLE_DEVICES=1 ./build-campaign/bin/test-llama-archs -a inkling2',
  'sh .campaign/cases/check.sh inkling-optimize-conv-kernel',
]
reviews = [
  'feature',
  'code',
]
notes = [
  '2026-11-17 09:36 CT: added; 1 of 1 checks fail, as they should before the work',
