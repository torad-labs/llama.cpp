spec = 'Marcos, 2026-11-22: dequantize at the tensor-core seams and requantize activations there, for memory management and compute together. Operands stay in their stored quantized form (weights, KV) and are converted to the MMA fragment form inside the tile/kernel that consumes them, never through a separate dequant pass or a materialized intermediate; an activation read by several products keeps one requantized form reused across them. This is a design law, not an experiment: no per-change speed A/B - correctness is the gate here, and speed is judged once on four cards at integration. Exactness: bit-identical where the arithmetic allows, otherwise the rounding is named on the row. Ships behind a switch that restores the old path until its parity proof lands, then defaults on per the shared-code law.'
