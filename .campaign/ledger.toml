notes = [
  '2026-11-17 09:38 CT: added; 1 of 1 checks fail, as they should before the work',
  "2026-11-17 09:40 CT: Step 4 of docs/torad/research/inkling-2-small/06-optimization-roadmap.md. Re-examine ggml_cuda_mmvq_moe_usable bounds, ggml_cuda_can_share_mmq_id and ggml_cuda_should_fuse_mul_mat_q at 384 experts, top-8, 2304/4608. At 23 served rows a layer touches roughly 150 experts, which is where the small-row vs grouped decision bites; decide from reads on this machine's card and record the read with the change. SITU softcapped activation must run in the fused path. GPU: card 1 only under gpu1.lock, CUDA_VISIBLE_DEVICES=1.",
  "2026-11-17 15:07 CT: Machine load: keep every build you start at 8 jobs or fewer (cmake --build ... -j 8, never a bare -j). The frozen checks predate this and some run unbounded; that is the lead's to fix after this campaign lands, not yours to edit. Your own builds are yours: bound them.",
  "2026-11-20 00:17 CT decode-search: Read on the four-card box, chapter 14 of docs/torad/research/inkling-2-small (lines 148-161): the expert projections are 14.2 ms of a 54.6 ms decode step at 23 sessions, the largest part left. The ring kernel in ggml/src/ggml-cuda/mmvq-moe.cu takes only IQ3_XXS and Q8_0 (mmvq_moe_takes) and at most 64 token-expert pairs (MMVQ_MOE_MAX_PAIRS, a 64-bit pair mask and two pairs a lane of the producer warp), and 23 sessions name 184 pairs, so the served Q3_K and Q4_K expert tensors never take it. This row's re-examination of ggml_cuda_mmvq_moe_usable should cover both bounds: the quant types and the pair count.",
  '2026-11-21 16:31 CT claude-tensor4: claimed',
  "2026-11-21 16:49 CT claude-tensor4: 2026-11-21 claude-tensor4: claimed. Started the row's gate re-examination at the dispatch level: the shared few-row quantize now exists (ggml-cuda.cu mmq_few_shared_q8, mmq-few.cu 7-arg mul_mat_q_few, GGML_CUDA_MMVQ_FEW_SHARED_Q8_1_LEGACY=1 escape) so the dense products that read one normalized input (wq/wk/wv/wqkv_gate on SWA layers) quantize it once per weight type instead of once per product. Bit-identical by construction; local validation on card 1 in progress. Router top-k already fused in this fork (topk_moe_cuda at ~48 calls/step in the old trace), so the argsort concern from the review was mostly stale. Remaining for the row: mmvq_moe_usable pair-count bound (184 routes vs 64), the cuBLAS cluster identity (~1.4 ms/step, needs a box trace), and the inkling-moe test surface. Rental runbook: reports/inkling2-tensor4-rental-runbook.md",
  "2026-11-21 17:08 CT claude-tensor4: 2026-11-21 claude-tensor4: Marcos: never use the local 5070 Ti (PCI card 1) for runs; use the 5080 (card 0, idle, CUDA_VISIBLE_DEVICES=0) or rent on CloudRift. The ledger's frozen checks still say gpu1.lock/card 1 - that's the lead's to change, not mine; until then my own runs take /run/user/1000/gpu0.lock on card 0.",
  "2026-11-21 17:10 CT claude-tensor4: 2026-11-21 claude-tensor4: found a pre-existing CUDA MUL_MAT_ID numeric regression on this tree. Failing shapes (test-backend-ops -b CUDA0 -o MUL_MAT_ID, CPU reference clean, 5080): q3_K/q4_K/q5_K, n_mats=32, n_used=8, m=256, n=17 and n=23, k=512, ids_offset=1, ERR up to 0.0268 vs 5e-4 tolerance. Ruled out: the new shared few-row quantize (m=256 never reaches few-row or the sharing intercept; GGML_CUDA_MMVQ_FEW_SHARED_Q8_1_LEGACY=1 still fails). The uncommitted diffs (tunables, ggml.c, top-k.cu, fattn) don't touch the MUL_MAT_ID meta path, so the suspect is the upstream merge 749b5307b. Not covered by any done row: inkling-baseline-arch only ran -o FLASH_ATTN_EXT, and this row's checks are expected-fail. Served 23-row decode shapes pass (test-llama-archs inkling2 4/4); whether prefill shapes (m=2048, k=4608) are affected is untested. Next: build 749b5307b and 3d9eea147 in worktrees and bisect.",
  "2026-11-21 17:17 CT claude-tensor4: 2026-11-21 claude-tensor4: MUL_MAT_ID regression pinned to the few-row MMQ ids path: GGML_CUDA_MMQ_FEW_LEGACY=1 -> OK, GGML_CUDA_MMVQ_KQUANT_MMID_MAX=32 -> OK (both steer around it); the five MMQ_* hatches still FAIL. Failing grid: tests/test-backend-ops.cpp:15868, {Q3_K,Q4_K,Q5_K} x tokens {17,23,32} x broadcast {0,1}, n_mats=32, m=256, k=512. At k=512 rows hold 2 units of 256 values, below mmq_few_ksplit's 8-unit threshold, so mul_mat_q_few has_ids takes the ROW-SPLIT mode; served shapes (18 units gate/up, 9 down) take K-split and pass - why test-llama-archs is green while the op test fails. Pattern: broadcast=false (one activation row per slot) fails all three types; broadcast=true fails only Q5_K, which needs the src1 sums (DS4). Suspects: quantize_mmq_few_id_q8_1's per-slot addressing under row-split geometry; Q5_K sums at 2 units. Next: dump wrong (token,slot) outputs, then fix in mmq-few/quantize.",
  '2026-11-21 17:28 CT claude-tensor4: 2026-11-21 claude-tensor4: correction + narrowing. The failing sets differ per run because the test seeds ids with an unseeded std::random_device (tests/test-backend-ops.cpp:7436) - the bug is CONTENT-DEPENDENT on the routing pattern, not a fixed shape list. PDL is ruled out: GGML_CUDA_PDL=0 still fails nondeterministically (11 and 9 failing cases in two runs vs 6/11/8 with PDL on). Established: the bug lives in the few-row ids path (MMQ_FEW_LEGACY=1 and MMVQ_KQUANT_MMID_MAX=32 both steer around it and pass); the failing family is the K-quant grid at tests/test-backend-ops.cpp:15868 (n_mats=32, m=256, k=512 = 2 units -> row-split mode; broadcast and token-count variants). Next session: seed the ids deterministically in a scratch build, capture a failing pattern, dump the wrong (token,slot) outputs, fix in quantize_mmq_few_id_q8_1 or mul_mat_q_few. Serving shapes (9-18 units -> K-split mode) are unaffected as far as test-llama-archs shows.',
  "2026-11-21 18:01 CT claude-tensor4: 2026-11-21 claude-tensor4: stress verdict - the dormant few-row ids bug did not reappear: 0 failing across 5 n=23-subset runs and 3 full MUL_MAT_ID suite runs on the current binary (the rebuilt lib includes the other seat's latest fattn work; code-layout lottery or an incidental change). The bug stays open on this row with the repro hooks wired (LLAMA_TEST_SEED, LLAMA_TEST_DUMP_MISMATCH) and the evidence chain in the earlier notes. All remaining GPU work moved off torad-server per Eli: the CloudRift 5090 (inkling-mini's box) now carries my tree at ~/inkling-small with my files pushed on top of their src-dev, building there; the 5080/5070 Ti are done.",
  "2026-11-21 20:00 CT claude-tensor4: 2026-11-22 claude-tensor4: the ring/K-quant prototype's design laws, mined from qgre's TMA campaign (all measured on sm_120): weight bytes ride TMA tile loads so they never touch a register (the row kernel's per-lane ld.global is the thing to remove); stage the K-quant scale words as their own SWIZZLE_128B rank-2 plane, one DMA per scale window (qgre: -6.8 pct time / +7.3 pct tok/s); HW swizzle beats padding (padding is refuted under SWIZZLE_128B); rank-3 (128,rows,chunks) DMAs accept non-monotonic strides (+3.03); evict_first on weight TMA loads is load-bearing (-4.9 if dropped), the bulk.tensor warm rides no hint, per-lane prefetch.global.L2 loops measured a loss; alignment laws: SMEM 128-B aligned, box inner <=128 B, strides x16, only the (B,4,3) swizzle family is legal, SMEM opt-in cap 101,376 B; qgre's TMA weight stream ran 88.1 pct of theoretical - the target for our expert kernels.",
  "2026-11-21 20:05 CT claude-tensor4: 2026-11-22 claude-tensor4: the launcher consolidated to ONE profile per Marcos: tensor-4 carries the combined measured configuration (query-first + compact greedy + the shared quantize, all default-on with escape hatches), and tensor-4-draft/capacity/quality are removed - their settings and why they lost are in the serve.py comment block. The --draft flag now applies the draft layout directly (context 1572864, ubatch 256, q8_0 target KV); search.py's default profile is tensor-4. 26/26 launcher tests pass. Arms so far: stock 292.01, fast 425.61, fast-rl32 424.23, fast-legacyq8 422.44, fast-gb4 419.61, fast-gb16 426.75 - the combined profile stands.",
  "2026-11-21 20:07 CT claude-tensor4: 2026-11-22 claude-tensor4: CORRECTION to my earlier ranking - the architecture-shaped plan (kernels-shaped-to-the-architecture doc) demotes the K-quant ring: at the probe's 102 distinct experts a layer, a step reads about 18.6 GB of expert weights a card (10-12 ms of pure reads) against 12.8 ms measured - the expert path is already near its byte floor, and the Q3_K block-reuse attempt measured -7.5. The ring pays only near 70 distinct experts; M1 (distinct experts in a traced step) settles it with one number. The TMA design laws in my earlier note still hold for whichever kernel is built. The plan's priority for the bytes: 3.1 far-cells-no-bias + 3.3 run addressing first (exact), then 3.4 one-byte KV in the tile kernel (E4M3 no-scale is safe because K is clipped to 22.63 and V normalized to RMS 1 - both far inside E4M3's range), then 3.2 shared-prefix read-once, then 3.7/3.6 (the two F32 products and the stacked Q-input product), 3.5 the window ring.",
  '2026-11-22 00:48 CT: 2026-11-22 00:52 CT llamacpp-coordinator: no row note since 2026-11-21 17:28 CT (7h+). If the row is active on the CloudRift tree (~/inkling-small), add a progress note naming where the MUL_MAT_ID row-split bug stands and what the row needs next; if it is parked, say who holds it.',
  "2026-11-22 01:44 CT: 2026-11-22 01:44 CT llamacpp-coordinator: no progress note from owner in 8+ hours and no live seat answers to codex/claude-tensor4; parking the row so the quiet-state is judgeable. Owner may reclaim with campaign claim + a progress note; the MUL_MAT_ID row-split bug and remaining checks stay documented in this row's earlier notes.",
  '2026-11-22 01:44 CT: status blocked',
]

