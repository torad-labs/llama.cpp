[[row]]
id = 'inkling-split-state-decisions'
title = 'Every Inkling tensor and cache has a split decision'
feature = 'inkling-split-state'
status = 'done'
owner = ''
blocked_by = []
guard = false
spec = 'Every weight tensor, cache and the convolution state of the inkling2 architecture has an explicit tensor-split decision in the meta backend, with special rules where the standard table has no analog. The global and sliding KV caches split by heads and are never mirrored. The meta split tests cover the Inkling tensor and cache names and fail if any of them would be mirrored instead of split.'
checks = [
  'git merge-base --is-ancestor d3c3e242c16b8cbf51400fad410cd69b22d64f35 HEAD && cmake -S . -B build-campaign -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=120a -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=OFF -DGGML_CCACHE=OFF && cmake --build build-campaign -j --target test-backend-meta-split && flock /run/user/1000/gpu1.lock env CUDA_VISIBLE_DEVICES=1 ./build-campaign/bin/test-backend-meta-split > /tmp/inkling-meta-split.out 2>&1 && grep -qi inkling /tmp/inkling-meta-split.out',
  'sh .campaign/cases/check.sh inkling-split-state-decisions',
]
reviews = [
  'feature',
  'code',
]
notes = [
  '2026-11-17 03:55 CT: added; 1 of 1 checks fail, as they should before the work',
  '2026-11-17 03:55 CT llamacpp-issues: Study: docs/torad/research/inkling-2-small/04-fork-gap-analysis.md item 6 lists the tensors with no standard analog, and 05-capacity-and-tensor4.md has the split the capacity math assumes. A mirrored global KV cache at BF16 would need about 92 GiB a card at the GLM pool size and simply not load.',
  '2026-11-17 06:09 CT campaign: done in round 1 of inkling-split-state: its checks, its feature review, its code review passed',
]

